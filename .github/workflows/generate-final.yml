name: Generate Final Wedding Site

on:
  repository_dispatch:
    types: [theme-selected]
  workflow_dispatch:
    inputs:
      slug:
        description: 'Wedding slug (e.g., ana-marko)'
        required: true
      theme:
        description: 'Selected theme (original: classic, modern, etc. | 2026: layout/theme e.g. envelope/velvet)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract parameters
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SLUG: ${{ github.event.client_payload.slug }}
          DISPATCH_THEME: ${{ github.event.client_payload.theme }}
          DISPATCH_EMAIL: ${{ github.event.client_payload.contact_email }}
          DISPATCH_RSVP_URL: ${{ github.event.client_payload.rsvp_sheet_url }}
          MANUAL_SLUG: ${{ github.event.inputs.slug }}
          MANUAL_THEME: ${{ github.event.inputs.theme }}
        run: |
          if [ "$EVENT_NAME" == "repository_dispatch" ]; then
            SLUG="$DISPATCH_SLUG"
            THEME="$DISPATCH_THEME"
            echo "contact_email=$DISPATCH_EMAIL" >> $GITHUB_OUTPUT
            echo "rsvp_sheet_url=$DISPATCH_RSVP_URL" >> $GITHUB_OUTPUT
          else
            SLUG="$MANUAL_SLUG"
            THEME="$MANUAL_THEME"
          fi
          # Validate slug format (lowercase alphanumeric and hyphens only)
          if [[ ! "$SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid slug format: $SLUG"
            exit 1
          fi
          # Validate theme format (lowercase alphanumeric, hyphens, and optional / for layout/theme)
          if [[ ! "$THEME" =~ ^[a-z0-9-]+(/[a-z0-9-]+)?$ ]]; then
            echo "::error::Invalid theme format: $THEME"
            exit 1
          fi
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "theme=$THEME" >> $GITHUB_OUTPUT

      - name: Download existing data
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
        run: |
          # Try to get wedding data from gh-pages branch
          git fetch origin gh-pages:gh-pages || true
          # Data is stored in public/data/ during preview generation
          git checkout gh-pages -- "data/${SLUG}.json" 2>/dev/null || true
          if [ -f "data/${SLUG}.json" ]; then
            echo "Found wedding data for ${SLUG}"
            cat "data/${SLUG}.json"
          else
            echo "WARNING: No wedding data found for ${SLUG}, will use defaults"
          fi

      - name: Validate wedding data exists
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
        run: |
          if [ ! -f "data/${SLUG}.json" ]; then
            echo "::error::Wedding data file not found for slug: ${SLUG}"
            echo "This likely means the preview generation failed to deploy data to gh-pages."
            echo "Please re-run the preview generation workflow first."
            exit 1
          fi
          # Validate the JSON file is not empty and is valid JSON
          if [ ! -s "data/${SLUG}.json" ]; then
            echo "::error::Wedding data file is empty for slug: ${SLUG}"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('data/${SLUG}.json'))" 2>/dev/null; then
            echo "::error::Wedding data file contains invalid JSON for slug: ${SLUG}"
            exit 1
          fi
          echo "Wedding data validated successfully for ${SLUG}"

      - name: Generate final site
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
          THEME: ${{ steps.extract.outputs.theme }}
        run: |
          node scripts/generate-final.js "$SLUG" "$THEME" --cleanup

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: ./
          keep_files: true

      - name: Clean up preview from GitHub Pages
        if: success()
        continue-on-error: true
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$(mktemp -d)"
          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" .
          if [ -d "preview/${SLUG}" ] || [ -f "data/${SLUG}.json" ]; then
            rm -rf "preview/${SLUG}" "data/${SLUG}.json"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Clean up preview for ${SLUG}"
            git push origin gh-pages
            echo "Preview cleaned up for ${SLUG}"
          else
            echo "No preview found for ${SLUG}"
          fi

      - name: Output final site URL
        run: |
          echo "## Final Site Generated Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** https://digipoz.rs/site/${{ steps.extract.outputs.slug }}/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Theme: ${{ steps.extract.outputs.theme }}" >> $GITHUB_STEP_SUMMARY

      - name: Send notification email
        if: success() && github.event_name == 'repository_dispatch' && steps.extract.outputs.contact_email != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🎉 Ваша позивница је спремна!"
          to: ${{ steps.extract.outputs.contact_email }}
          from: DigiPoz <${{ secrets.EMAIL_USERNAME }}>
          html_body: |
            <!DOCTYPE html>
            <html>
            <head><meta charset="utf-8"></head>
            <body style="margin:0;padding:0;background:#f8f6f2;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
              <div style="max-width:560px;margin:0 auto;padding:40px 20px;">
                <div style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.06);">
                  <div style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:40px 32px;text-align:center;">
                    <div style="font-size:28px;margin-bottom:12px;">🎉</div>
                    <h1 style="color:#d4af37;font-size:22px;font-weight:400;margin:0 0 6px;font-family:Georgia,'Times New Roman',serif;">DigiPoz</h1>
                    <p style="color:rgba(255,255,255,0.6);font-size:12px;margin:0;letter-spacing:2px;text-transform:uppercase;">Дигиталне позивнице за венчање</p>
                  </div>
                  <div style="padding:36px 32px;">
                    <h2 style="color:#1a1a2e;font-size:20px;font-weight:500;margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;">Ваша позивница је спремна! 🥂</h2>
                    <p style="color:#555;font-size:15px;line-height:1.7;margin:0 0 12px;">Ваша дигитална позивница за венчање је завршена и спремна за дељење са гостима.</p>
                    <p style="color:#555;font-size:15px;line-height:1.7;margin:0 0 24px;">Једноставно проследите линк испод свим вашим гостима — позивница је оптимизована за телефоне, таблете и рачунаре.</p>
                    <div style="text-align:center;margin:28px 0;">
                      <a href="https://digipoz.rs/site/${{ steps.extract.outputs.slug }}/" style="display:inline-block;background:linear-gradient(135deg,#d4af37,#b8960c);color:#fff;text-decoration:none;padding:14px 36px;border-radius:8px;font-size:15px;font-weight:500;letter-spacing:0.5px;">Отворите позивницу &rarr;</a>
                    </div>
                    <div style="background:#f0f7f0;border:1px solid #c6f6d5;border-radius:10px;padding:16px 20px;margin:20px 0 0;">
                      <p style="color:#2d6a4f;font-size:13px;line-height:1.6;margin:0;">
                        <strong>🔗 Линк за дељење</strong><br>
                        <code style="background:#e8f5e9;padding:4px 8px;border-radius:4px;font-size:12px;word-break:break-all;">https://digipoz.rs/site/${{ steps.extract.outputs.slug }}/</code>
                      </p>
                    </div>
                    <div style="background:#fdf8ee;border:1px solid #f0e6cc;border-radius:10px;padding:16px 20px;margin:12px 0 0;">
                      <p style="color:#8b7355;font-size:13px;line-height:1.6;margin:0;">
                        <strong>📋 Праћење потврда доласка</strong><br>
                        Пратите ко долази у вашој RSVP табели:<br>
                        <a href="${{ steps.extract.outputs.rsvp_sheet_url }}" style="color:#b8960c;word-break:break-all;">${{ steps.extract.outputs.rsvp_sheet_url }}</a>
                      </p>
                    </div>
                  </div>
                  <div style="border-top:1px solid #f0ece4;padding:24px 32px;text-align:center;">
                    <p style="color:#999;font-size:13px;margin:0 0 4px;">Срећно венчање! 💕</p>
                    <p style="color:#aaa;font-size:12px;margin:0;">
                      &copy; 2026 <a href="https://digipoz.rs" style="color:#b8960c;text-decoration:none;">digipoz.rs</a> &mdash; Дигиталне позивнице за венчање
                    </p>
                  </div>
                </div>
              </div>
            </body>
            </html>
