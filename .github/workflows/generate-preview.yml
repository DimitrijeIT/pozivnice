name: Generate Wedding Preview

'on':
  repository_dispatch:
    types:
      - new-wedding
  workflow_dispatch:
    inputs:
      slug:
        description: Wedding slug (e.g., ana-marko)
        required: true
      wedding_data:
        description: Wedding data JSON
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract wedding data
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SLUG: ${{ github.event.client_payload.slug }}
          DISPATCH_RSVP_URL: ${{ github.event.client_payload.rsvp_sheet_url }}
          MANUAL_SLUG: ${{ github.event.inputs.slug }}
          WEDDING_DATA_DISPATCH: ${{ toJson(github.event.client_payload.wedding_data) }}
          WEDDING_DATA_MANUAL: ${{ github.event.inputs.wedding_data }}
        run: |
          if [ "$EVENT_NAME" == "repository_dispatch" ]; then
            SLUG="$DISPATCH_SLUG"
            echo "rsvp_sheet_url=$DISPATCH_RSVP_URL" >> $GITHUB_OUTPUT
            printenv WEDDING_DATA_DISPATCH > data/temp-wedding.json
          else
            SLUG="$MANUAL_SLUG"
            echo "rsvp_sheet_url=" >> $GITHUB_OUTPUT
            printenv WEDDING_DATA_MANUAL > data/temp-wedding.json
          fi
          # Validate slug format (lowercase alphanumeric and hyphens only)
          if [[ ! "$SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid slug format: $SLUG"
            exit 1
          fi
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Save wedding data file
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
        run: |
          mv data/temp-wedding.json "data/${SLUG}.json"
          cat "data/${SLUG}.json"

      - name: Generate preview
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
        run: node scripts/generate-preview.js "$SLUG"

      - name: Persist wedding data for final generation
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
        run: |
          mkdir -p public/data
          cp "data/${SLUG}.json" "public/data/${SLUG}.json"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: ./
          keep_files: true

      - name: Output preview URL
        run: |
          echo "## Preview Generated Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** https://digipoz.rs/preview/${{ steps.extract.outputs.slug }}/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Share this link with the couple to select their theme." >> $GITHUB_STEP_SUMMARY

      - name: Send notification email
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.contact_email != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "💍 Ваш преглед позивнице је спреман!"
          to: ${{ github.event.client_payload.contact_email }}
          from: DigiPoz <${{ secrets.EMAIL_USERNAME }}>
          html_body: |
            <!DOCTYPE html>
            <html>
            <head><meta charset="utf-8"></head>
            <body style="margin:0;padding:0;background:#f8f6f2;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
              <div style="max-width:560px;margin:0 auto;padding:40px 20px;">
                <div style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.06);">
                  <div style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:40px 32px;text-align:center;">
                    <div style="font-size:28px;margin-bottom:12px;">💍</div>
                    <h1 style="color:#d4af37;font-size:22px;font-weight:400;margin:0 0 6px;font-family:Georgia,'Times New Roman',serif;">DigiPoz</h1>
                    <p style="color:rgba(255,255,255,0.6);font-size:12px;margin:0;letter-spacing:2px;text-transform:uppercase;">Дигиталне позивнице за венчање</p>
                  </div>
                  <div style="padding:36px 32px;">
                    <h2 style="color:#1a1a2e;font-size:20px;font-weight:500;margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;">Ваш преглед је спреман! ✨</h2>
                    <p style="color:#555;font-size:15px;line-height:1.7;margin:0 0 24px;">Припремили смо вашу позивницу у више прелепих дизајна. Погледајте све варијанте и изаберите ону која најбоље одражава ваш стил.</p>
                    <div style="text-align:center;margin:28px 0;">
                      <a href="https://digipoz.rs/preview/${{ steps.extract.outputs.slug }}/" style="display:inline-block;background:linear-gradient(135deg,#d4af37,#b8960c);color:#fff;text-decoration:none;padding:14px 36px;border-radius:8px;font-size:15px;font-weight:500;letter-spacing:0.5px;">Погледајте дизајне &rarr;</a>
                    </div>
                    <div style="background:#fdf8ee;border:1px solid #f0e6cc;border-radius:10px;padding:16px 20px;margin:24px 0 0;">
                      <p style="color:#8b7355;font-size:13px;line-height:1.6;margin:0;">
                        <strong>📋 Праћење потврда доласка</strong><br>
                        Линк до ваше RSVP табеле за праћење гостију:<br>
                        <a href="${{ steps.extract.outputs.rsvp_sheet_url }}" style="color:#b8960c;word-break:break-all;">${{ steps.extract.outputs.rsvp_sheet_url }}</a>
                      </p>
                    </div>
                  </div>
                  <div style="border-top:1px solid #f0ece4;padding:20px 32px;text-align:center;">
                    <p style="color:#aaa;font-size:12px;margin:0;">
                      &copy; 2026 <a href="https://digipoz.rs" style="color:#b8960c;text-decoration:none;">digipoz.rs</a> &mdash; Дигиталне позивнице за венчање
                    </p>
                  </div>
                </div>
              </div>
            </body>
            </html>