name: Generate Wedding Preview

'on':
  repository_dispatch:
    types:
      - new-wedding
  workflow_dispatch:
    inputs:
      slug:
        description: Wedding slug (e.g., ana-marko)
        required: true
      wedding_data:
        description: Wedding data JSON
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract wedding data
        id: extract
        env:
          WEDDING_DATA_DISPATCH: ${{ toJson(github.event.client_payload.wedding_data) }}
          WEDDING_DATA_MANUAL: ${{ github.event.inputs.wedding_data }}
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "slug=${{ github.event.client_payload.slug }}" >> $GITHUB_OUTPUT
            echo "rsvp_sheet_url=${{ github.event.client_payload.rsvp_sheet_url }}" >> $GITHUB_OUTPUT
            printenv WEDDING_DATA_DISPATCH > data/temp-wedding.json
          else
            echo "slug=${{ github.event.inputs.slug }}" >> $GITHUB_OUTPUT
            echo "rsvp_sheet_url=" >> $GITHUB_OUTPUT
            printenv WEDDING_DATA_MANUAL > data/temp-wedding.json
          fi

      - name: Save wedding data file
        run: |
          SLUG="${{ steps.extract.outputs.slug }}"
          mv data/temp-wedding.json "data/${SLUG}.json"
          cat "data/${SLUG}.json"

      - name: Generate preview
        run: node scripts/generate-preview.js ${{ steps.extract.outputs.slug }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: ./
          keep_files: true

      - name: Output preview URL
        run: |
          echo "## Preview Generated Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** https://digipoz.rs/preview/${{ steps.extract.outputs.slug }}/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Share this link with the couple to select their theme." >> $GITHUB_STEP_SUMMARY

      - name: Send notification email
        if: success() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Ваш преглед позивнице је спреман! - ${{ steps.extract.outputs.slug }}
          to: ${{ github.event.client_payload.contact_email }}
          from: Позивнице <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Поштовани,

            Ваш преглед позивнице за венчање је спреман!

            Погледајте све теме и изаберите ону која вам се највише свиђа:
            https://digipoz.rs/preview/${{ steps.extract.outputs.slug }}/

            Линк важи 24 сата.

            Табела за праћење потврда доласка (RSVP):
            ${{ steps.extract.outputs.rsvp_sheet_url }}

            Срдачан поздрав,
            Позивнице.rs тим